<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>PsiAgenda — Clínica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5F9;
    --surface:#FFFFFF;
    --surface-2:#EFECF5;
    --primary:#4A4785;
    --primary-dark:#2E2B5C;
    --accent:#B9A9D9;
    --accent-2:#C15C5C;
    --text:#2A2640;
    --muted:#746E8C;
    --line:#E1DCEE;
    --success:#6FA287;
    --danger:#C15C5C;
    --radius:14px;
    --shadow:0 4px 18px rgba(46,43,92,0.10);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  #root{min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;background:var(--bg);position:relative;}

  /* marca psi */
  .psi-badge{border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;color:var(--primary);position:relative;flex-shrink:0;}
  .psi-badge.on-dark{background:rgba(255,255,255,0.12);color:#fff;}

  /* ---- LOGIN ---- */
  .login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:
    radial-gradient(circle at 20% 10%, rgba(74,71,133,0.10), transparent 55%),
    radial-gradient(circle at 85% 85%, rgba(185,169,217,0.25), transparent 50%), var(--bg);}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:30px;}
  .brand-name{font-size:22px;font-weight:600;color:var(--primary-dark);letter-spacing:-0.01em;}
  .login-card{width:100%;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:32px 26px;}
  .login-card h1{font-size:24px;margin:0 0 6px;color:var(--primary-dark);font-weight:600;}
  .login-card p.sub{margin:0 0 26px;color:var(--muted);font-size:14px;line-height:1.5;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;font-size:15px;background:var(--surface);color:var(--text);outline:none;transition:border-color .15s;resize:vertical;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);}
  .field input:disabled{background:var(--surface-2);color:var(--muted);}
  .btn-primary{width:100%;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:15px;font-weight:600;transition:background .15s, transform .1s;}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{padding:11px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-size:14px;font-weight:600;}
  .btn-secondary:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn-ghost{background:none;border:none;color:var(--primary);font-weight:600;font-size:14px;padding:8px;}
  .btn-danger{background:none;border:1.5px solid rgba(193,92,92,0.35);color:var(--danger);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;}
  .err-msg{background:rgba(193,92,92,0.08);border:1px solid rgba(193,92,92,0.25);color:var(--danger);font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px;}
  .hint{margin-top:22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6;}

  /* ---- APP SHELL ---- */
  .topbar{background:var(--primary-dark);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;}
  .topbar .who{display:flex;flex-direction:column;}
  .topbar .who .name{font-size:14.5px;font-weight:600;}
  .topbar .who .role{font-size:11px;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:0.06em;margin-top:1px;}
  .logout-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;}
  .logout-btn:hover{background:rgba(255,255,255,0.22);}

  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:19;}
  .tab-btn{flex:1;padding:13px 4px;border:none;background:none;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2.5px solid transparent;}
  .tab-btn.active{color:var(--primary-dark);border-bottom-color:var(--accent);}

  .content{flex:1;padding:18px 16px 40px;}

  /* calendar */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-header h2{margin:0;font-size:19px;color:var(--primary-dark);font-weight:600;}
  .cal-nav-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;}
  .cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;padding-bottom:4px;}
  .cal-day{aspect-ratio:1;border-radius:10px;background:var(--surface);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--text);position:relative;}
  .cal-day.empty{visibility:hidden;}
  .cal-day.today{outline:2px solid var(--accent);}
  .cal-day.selected{background:var(--primary);color:#fff;border-color:var(--primary);}

  .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--primary);font-weight:600;font-size:13.5px;background:none;border:none;padding:0 0 14px;}

  .day-title{font-size:18px;font-weight:600;color:var(--primary-dark);margin:0 0 4px;}
  .day-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}

  .prof-block{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}

  .slot{padding:14px 16px;border-top:1px solid var(--line);}
  .slot-time-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
  .slot-time-input{width:64px;padding:6px 8px;border:1.5px solid var(--line);border-radius:7px;font-size:12.5px;font-family:'IBM Plex Mono',monospace;text-align:center;color:var(--primary-dark);background:var(--surface);}
  .slot-time-input:disabled{background:var(--surface-2);color:var(--muted);border-style:dashed;}
  .slot-time-static{padding:6px 10px;border-radius:7px;background:var(--surface-2);font-size:12.5px;font-family:'IBM Plex Mono',monospace;color:var(--muted);}
  .slot-del-btn{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--danger);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .pat-input{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--bg);color:var(--text);}
  .pat-input:focus{outline:none;border-color:var(--primary);background:#fff;}
  .obs-input{width:100%;margin-top:8px;padding:9px 11px;border:1.5px dashed var(--line);border-radius:8px;font-size:12.5px;color:var(--muted);background:transparent;}
  .obs-input:focus{outline:none;border-color:var(--accent);color:var(--text);}
  .save-flag{font-size:11px;color:var(--success);font-weight:600;margin-top:6px;opacity:0;transition:opacity .3s;}
  .save-flag.show{opacity:1;}
  .add-slot-row{padding:14px 16px;border-top:1px dashed var(--line);text-align:center;}
  .add-slot-link{color:var(--primary);font-weight:600;font-size:13px;background:none;border:none;}

  /* lists (profissionais/usuarios) */
  .list-card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .list-card .li-main{display:flex;align-items:center;gap:12px;}
  .prof-select-card{width:100%;text-align:left;background:var(--surface);border:none;border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;font:inherit;color:inherit;}
  .li-info .li-title{font-weight:600;font-size:14.5px;color:var(--text);}
  .li-info .li-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.04em;}
  .badge.admin{background:rgba(193,92,92,0.12);color:var(--danger);}
  .badge.profissional{background:rgba(74,71,133,0.12);color:var(--primary);}
  .badge.recepcao{background:rgba(185,169,217,0.3);color:#5b4d82;}

  .section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;}
  .section-title h3{margin:0;font-size:15px;color:var(--primary-dark);}
  .add-btn{background:var(--primary);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;}

  .modal-bg{position:fixed;inset:0;background:rgba(46,43,92,0.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:24px 20px 30px;max-height:85vh;overflow-y:auto;}
  .modal h3{margin:0 0 18px;color:var(--primary-dark);font-size:17px;}
  .modal-actions{display:flex;gap:10px;margin-top:22px;}
  .modal-actions .btn-primary{flex:1;}

  .note-box{background:rgba(185,169,217,0.18);border:1px solid rgba(185,169,217,0.4);border-radius:10px;padding:11px 13px;font-size:12px;color:#5b4d82;line-height:1.5;margin-bottom:16px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .psi-badge{margin:0 auto 14px;width:56px;height:56px;font-size:26px;}

  .loading-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);font-size:13px;}
  .spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  ::selection{background:rgba(185,169,217,0.45);}
  *:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* impressão */
  .print-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);color:var(--primary-dark);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .print-btn:hover{border-color:var(--primary);}
  #print-area{display:none;}
  #print-area table{width:100%;border-collapse:collapse;margin-top:14px;}
  #print-area th,#print-area td{text-align:left;padding:8px 10px;border-bottom:1px solid #ccc;font-size:13px;}
  #print-area th{border-bottom:2px solid #333;}
  #print-area .p-section + .p-section{page-break-before:always;break-before:page;margin-top:28px;}
  @media print{
    body *{visibility:hidden;}
    #print-area{display:block !important;visibility:visible;position:absolute;left:0;top:0;width:100%;padding:10px 0;}
    #print-area *{visibility:visible;}
  }

  /* ---- PAINEL DE VAGAS DO DIA (topo do calendário) ---- */
  .hoje-box{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:18px;}
  .hoje-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .hoje-hoje{font-size:12px;font-weight:700;color:#fff;background:var(--primary);padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;}
  .hoje-data{font-size:13.5px;color:var(--muted);font-weight:600;}
  .hoje-nav{display:flex;align-items:center;gap:6px;margin-left:auto;}
  .hoje-nav-btn{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--primary-dark);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}
  .hoje-nav-btn:hover{border-color:var(--primary);}
  .hoje-nav input[type=date]{border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12.5px;font-family:inherit;color:var(--text);background:var(--surface);}
  .hoje-load,.hoje-vazio{color:var(--muted);font-size:13px;padding:4px 0;}
  .hoje-prof + .hoje-prof{border-top:1px solid var(--line);margin-top:14px;padding-top:14px;}
  .hoje-prof-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .hoje-slots{display:flex;flex-wrap:wrap;gap:7px;}
  .hoje-slot{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);padding:6px 10px;min-width:96px;text-align:left;}
  .hoje-slot .hs-h{font-size:12.5px;font-weight:700;color:var(--primary-dark);}
  .hoje-slot .hs-v{font-size:10.5px;color:var(--muted);font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hoje-slot.livre{background:rgba(76,140,107,0.1);border-color:rgba(76,140,107,0.4);}
  .hoje-slot.livre .hs-v{color:var(--success);}
  .hoje-slot.cheio{background:rgba(185,169,217,0.22);border-color:rgba(140,120,180,0.45);}
  .hoje-slot:hover{border-color:var(--primary);}

  /* ---- TELAS MAIORES (tablet/computador) ---- */
  @media (min-width: 700px){
    #root{max-width:none;width:100%;}
    .content{padding:26px 32px 52px;}
    .cal-grid{gap:10px;max-width:620px;margin-left:auto;margin-right:auto;}
    .cal-header{max-width:620px;margin-left:auto;margin-right:auto;}
    .list-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px;align-items:start;}
    .list-grid > .list-card,.list-grid > .prof-select-card{margin-bottom:0;}
    .modal-bg{align-items:center;}
    .modal{border-radius:20px;max-height:80vh;max-width:560px;}
  }
  @media (min-width: 1100px){
    .content{padding:30px 48px 60px;}
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============== MARCA PSI ============== */
function psiBadge(size, onDark){
  const s = size || 30;
  const fs = Math.round(s*0.55);
  return `<div class="psi-badge ${onDark?'on-dark':''}" style="width:${s}px;height:${s}px;font-size:${fs}px;">Ψ</div>`;
}

/* ============== STATE ============== */
let professionals = [];
let users = [];
let currentUser = null;
let authToken = null;
let apptsCache = {}; // "profId|date" -> array de horários [{id, horarioInicio, horarioFim, paciente, obs}]
// O calendário abre sempre no mês de HOJE (data real do aparelho), nunca numa data fixa.
function currentMonthStart(){ const h = new Date(); return new Date(h.getFullYear(), h.getMonth(), 1); }
let view = { tab: 'agenda', screen: 'calendar', monthCursor: currentMonthStart(), selectedDate: null, selectedProfId: null, multiProfDay: false, editingProf: null, editingUser: null };
let dayPollTimer = null; // atualização automática da agenda do dia
let painelDate = null;   // dia que o painel de vagas está mostrando (null = hoje)
let loading = true;
let loginError = '';

const DOW_ABBR = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const WEEK_DAYS = ['Seg','Ter','Qua','Qui','Sex'];
const MONTH_NAMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ============== API HELPERS ============== */
async function api(path, options={}){
  const headers = Object.assign({'Content-Type':'application/json'}, options.headers||{});
  if(authToken) headers['Authorization'] = 'Bearer ' + authToken;
  const res = await fetch('/api'+path, Object.assign({}, options, {headers}));
  let body = null;
  try{ body = await res.json(); }catch(e){ /* sem corpo */ }
  if(!res.ok){
    if(res.status===401){ logoutLocal(); }
    throw new Error((body && body.error) || ('Erro na requisição ('+res.status+')'));
  }
  return body;
}
function logoutLocal(){
  currentUser = null; authToken = null;
  try{ localStorage.removeItem('psiagenda_token'); localStorage.removeItem('psiagenda_user'); }catch(e){}
}

async function loadClinicData(){
  try{ professionals = await api('/professionals'); }catch(e){ professionals = []; }
  if(currentUser.role==='admin'){
    try{ users = await api('/users'); }catch(e){ users = []; }
  }
}
async function loadAppts(profId, dateStr){
  const list = await api('/appointments/'+profId+'/'+dateStr);
  apptsCache[profId+'|'+dateStr] = list;
  return list;
}

/* ============== UTIL ============== */
function dateKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dowAbbr(d){ return DOW_ABBR[d.getDay()]; }
function initials(name){ return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ============== RENDER ROOT ============== */
function render(){
  const root = document.getElementById('root');
  if(loading){ root.innerHTML = renderLoading(); return; }
  if(!currentUser){ root.innerHTML = renderLogin(); attachLoginHandlers(); return; }
  root.innerHTML = renderAppShell();
  attachShellHandlers();
}

function renderLoading(){
  return `<div class="loading-wrap"><div class="spinner"></div><div>Carregando agenda…</div></div>`;
}

/* ============== LOGIN ============== */
function renderLogin(){
  return `
  <div class="login-wrap">
    <div class="brand">
      ${psiBadge(56)}
      <span class="brand-name">PsiAgenda</span>
    </div>
    <div class="login-card">
      <h1>Entrar</h1>
      <p class="sub">Use o login e senha criados pela administração da clínica.</p>
      ${loginError ? `<div class="err-msg">${loginError}</div>` : ''}
      <form id="login-form">
        <div class="field">
          <label>Usuário</label>
          <input type="text" id="login-user" autocomplete="username" placeholder="ex: dra.marina">
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="login-pass" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="button" id="login-btn" class="btn-primary">Entrar</button>
      </form>
      <div class="hint">Não tem acesso? Peça ao(à) profissional responsável<br>ou à administração da clínica para criar seu usuário.</div>
    </div>
  </div>`;
}
function attachLoginHandlers(){
  const form = document.getElementById('login-form');
  const userInput = document.getElementById('login-user');
  const passInput = document.getElementById('login-pass');
  const btn = document.getElementById('login-btn');

  async function doLogin(){
    try{
      const u = (userInput.value || '').trim().toLowerCase();
      const p = passInput.value || '';
      if(!u || !p){ loginError = 'Preencha usuário e senha.'; render(); return; }
      btn.textContent = 'Entrando…'; btn.disabled = true;
      const res = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({username:u, password:p})
      });
      const body = await res.json().catch(()=>({}));
      if(!res.ok){
        loginError = body.error || 'Usuário ou senha incorretos.';
        btn.textContent = 'Entrar'; btn.disabled = false;
        render();
        return;
      }
      currentUser = body.user;
      authToken = body.token;
      try{
        localStorage.setItem('psiagenda_token', authToken);
        localStorage.setItem('psiagenda_user', JSON.stringify(currentUser));
      }catch(e){ /* localStorage indisponível: sessão só dura enquanto a aba estiver aberta */ }
      loginError = '';
      view = { tab: 'agenda', screen:'calendar', monthCursor:currentMonthStart(), selectedDate:null, selectedProfId:null, multiProfDay:false, editingProf:null, editingUser:null };
      loading = true; render();
      await loadClinicData();
      loading = false; render();
    }catch(err){
      loginError = 'Erro ao entrar: ' + (err && err.message ? err.message : String(err));
      btn.textContent = 'Entrar'; btn.disabled = false;
      render();
    }
  }

  btn.addEventListener('click', doLogin);
  form.addEventListener('submit', e=>{ e.preventDefault(); doLogin(); });
  [userInput, passInput].forEach(inp=>{
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doLogin(); } });
  });
}

/* ============== APP SHELL ============== */
function renderAppShell(){
  const roleLabel = {admin:'Administrador(a)', profissional:'Profissional', recepcao:'Recepção'}[currentUser.role];
  let tabs = '';
  if(currentUser.role==='admin'){
    tabs = tabBtn('agenda','Agenda') + tabBtn('profissionais','Profissionais') + tabBtn('usuarios','Usuários');
  } else if(currentUser.role==='recepcao'){
    tabs = tabBtn('agenda','Agenda') + tabBtn('profissionais','Profissionais');

function visibleProfessionals(){
  if(currentUser.role==='profissional'){
    return professionals.filter(p=>p.id===currentUser.profissionalId);
  }
  return professionals;
}
function canEditHorarios(){

function renderAgendaTab(){
  if(view.screen==='day' && view.selectedDate){
    return renderDayView();
  }
  if(view.screen==='profSelect' && view.selectedDate){
    return renderProfSelectView();
  }
  return renderCalendarView();

function startOfWeekMonday(d){
  const wd = (d.getDay()+6)%7; // 0=Mon..6=Sun
  const res = new Date(d.getFullYear(), d.getMonth(), d.getDate()-wd);
  return res;
}

function renderCalendarView(){
  const cursor = view.monthCursor;
  const label = MONTH_NAMES[cursor.getMonth()] + ' de ' + cursor.getFullYear();
  const firstOfMonth = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
  const lastOfMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0);
  const gridStart = startOfWeekMonday(firstOfMonth);
  const gridEndMonday = startOfWeekMonday(lastOfMonth);
  const gridEnd = new Date(gridEndMonday.getFullYear(), gridEndMonday.getMonth(), gridEndMonday.getDate()+4);

  let cells = '';
  for(let d = new Date(gridStart); d<=gridEnd; d.setDate(d.getDate()+1)){
    const wd = d.getDay();
    if(wd===0 || wd===6) continue;
    if(d.getMonth()!==cursor.getMonth()){
      cells += `<div class="cal-day empty"></div>`;
      continue;
    }
    const isToday = dateKey(d)===dateKey(new Date());
    cells += `<button class="cal-day ${isToday?'today':''}" data-date="${dateKey(d)}">${d.getDate()}</button>`;
  }

  const emptyMsg = visibleProfessionals().length===0
    ? (currentUser.role==='admin'
        ? `<div class="empty-state">${psiBadge(56)}<div>Ainda não há profissionais cadastrados(as).<br>Vá na aba <strong>Profissionais</strong> para adicionar.</div></div>`
        : `<div class="empty-state">${psiBadge(56)}<div>Nenhuma profissional vinculada a este usuário ainda.<br>Fale com a administração.</div></div>`)
    : '';

  return `
    <div id="hoje-painel"><div class="hoje-box"><div class="hoje-load">Carregando os horários do dia…</div></div></div>
    <div class="cal-header">
      <button class="cal-nav-btn" id="prev-month">‹</button>
      <h2 class="display">${label}</h2>
      <button class="cal-nav-btn" id="next-month">›</button>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:6px;">
      <button class="print-btn" id="open-print-all-btn" style="margin-bottom:0;">🖨️ Imprimir agendas do dia</button>
    </div>
    <div class="cal-grid">
      ${WEEK_DAYS.map(d=>`<div class="cal-dow">${d}</div>`).join('')}
      ${cells}
    </div>
    ${emptyMsg}
  `;
}

/* ---- PAINEL DE VAGAS DO DIA ----
   Mostra, para um dia escolhido, cada profissional com os horários já criados,
   quais estão livres e quais já têm paciente. Dá para navegar entre os dias. */
function ehFimDeSemana(d){ const w = d.getDay(); return w===0 || w===6; }
function pulaFimDeSemana(d, passo){
  const r = new Date(d);
  do{ r.setDate(r.getDate()+passo); } while(ehFimDeSemana(r));
  return r;
}
async function renderHojePainelAsync(){
  const alvo = document.getElementById('hoje-painel');
  if(!alvo) return;
  const hojeReal = new Date();
  const dia = painelDate ? new Date(painelDate) : new Date(hojeReal.getFullYear(), hojeReal.getMonth(), hojeReal.getDate());
  const dk = dateKey(dia);
  const ehHoje = dk === dateKey(hojeReal);
  const dataLabel = cap(dia.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long'}));
  const profs = visibleProfessionals();

  const cabecalho = `
    <div class="hoje-head">
      <span class="hoje-hoje">${ehHoje?'Hoje':'Agenda'}</span>
      <span class="hoje-data">${dataLabel}</span>
      <div class="hoje-nav">
        <button type="button" class="hoje-nav-btn" id="hoje-prev" title="Dia anterior">‹</button>
        <input type="date" id="hoje-date" value="${dk}" title="Escolher o dia">
        <button type="button" class="hoje-nav-btn" id="hoje-next" title="Próximo dia">›</button>
        ${ehHoje?'':`<button type="button" class="btn-ghost" id="hoje-voltar" style="padding:4px 8px;font-size:12.5px;">Hoje</button>`}
      </div>
    </div>`;

  function ligarNavegacao(){
    const prev = alvo.querySelector('#hoje-prev');
    const next = alvo.querySelector('#hoje-next');
    const inp = alvo.querySelector('#hoje-date');
    const volta = alvo.querySelector('#hoje-voltar');
    if(prev) prev.addEventListener('click', ()=>{ painelDate = pulaFimDeSemana(dia, -1); renderHojePainelAsync(); });
    if(next) next.addEventListener('click', ()=>{ painelDate = pulaFimDeSemana(dia, 1); renderHojePainelAsync(); });
    if(volta) volta.addEventListener('click', ()=>{ painelDate = null; renderHojePainelAsync(); });
    if(inp) inp.addEventListener('change', ()=>{
      if(!inp.value) return;
      const [y,m,d2] = inp.value.split('-').map(Number);
      painelDate = new Date(y, m-1, d2);
      renderHojePainelAsync();
    });
  }

  if(profs.length===0){
    alvo.innerHTML = `<div class="hoje-box">${cabecalho}<div class="hoje-vazio">Nenhuma profissional cadastrada.</div></div>`;
    ligarNavegacao();
    return;
  }

  const blocos = [];
  for(const prof of profs){
    let slots = [];
    try{ slots = await loadAppts(prof.id, dk); }
    catch(e){ slots = apptsCache[prof.id+'|'+dk] || []; }
    const livres = slots.filter(s=>!(s.paciente && s.paciente.trim())).length;
    const chips = slots.map(s=>{
      const ocupado = !!(s.paciente && s.paciente.trim());
      return `<button type="button" class="hoje-slot ${ocupado?'cheio':'livre'}" data-hoje-prof="${prof.id}" title="${ocupado?s.paciente.replace(/"/g,'&quot;'):'Horário livre'}">
        <span class="hs-h mono">${s.horarioInicio} – ${s.horarioFim}</span><span class="hs-v">${ocupado?s.paciente.replace(/</g,'&lt;'):'livre'}</span>
      </button>`;
    }).join('');
    const corpo = slots.length
      ? `<div class="hoje-slots">${chips}</div>`
      : `<div class="hoje-vazio">Nenhum horário criado para este dia.</div>`;
    blocos.push(`
      <div class="hoje-prof">
        <div class="hoje-prof-head">
          <div class="li-main">
            <div class="avatar">${initials(prof.nome)}</div>
            <div class="li-info">
              <div class="li-title">${prof.nome}</div>
              <div class="li-sub">${slots.length} horário${slots.length===1?'':'s'} · <strong style="color:${livres?'var(--success)':'var(--muted)'};">${livres} livre${livres===1?'':'s'}</strong></div>
            </div>
          </div>
          <button class="btn-secondary" data-hoje-abrir="${prof.id}" style="padding:7px 11px;font-size:12.5px;">Abrir agenda</button>
        </div>
        ${corpo}
      </div>`);
  }

  alvo.innerHTML = `<div class="hoje-box">${cabecalho}${blocos.join('')}</div>`;
  ligarNavegacao();

  alvo.querySelectorAll('[data-hoje-abrir], .hoje-slot').forEach(el=>{
    el.addEventListener('click', ()=>{
      const pid = el.dataset.hojeAbrir || el.dataset.hojeProf;
      view.selectedDate = new Date(dia.getFullYear(), dia.getMonth(), dia.getDate());
      view.selectedProfId = pid;
      view.screen = 'day';
      view.multiProfDay = profs.length>1;
      render();
      renderDayViewAsync();
    });
  });
}

// Mantém a agenda do dia atualizada sozinha: a cada 8s busca de novo no servidor
// e só redesenha se ninguém estiver digitando naquele instante (pra não apagar o
// que a pessoa está escrevendo). Para sozinho ao sair da tela do dia.
function startDayPoll(){
  if(dayPollTimer){ clearInterval(dayPollTimer); dayPollTimer = null; }
  dayPollTimer = setInterval(async ()=>{
    if(!(view.tab==='agenda' && view.screen==='day' && view.selectedDate && view.selectedProfId)){
      clearInterval(dayPollTimer); dayPollTimer = null; return;
    }
    const ae = document.activeElement;
    const digitando = ae && (ae.classList.contains('pat-input') || ae.classList.contains('obs-input') || ae.classList.contains('slot-time-input') || ae.id==='ns-inicio' || ae.id==='ns-fim' || ae.id==='ns-paciente');
    if(digitando) return;
    if(document.getElementById('add-slot-form')) return; // formulário de novo horário aberto
    try{ await renderDayViewAsync(); }catch(e){ /* tenta de novo no próximo ciclo */ }
  }, 8000);
}

async function renderDayViewAsync(){
  const d = view.selectedDate;
  const prof = professionals.find(p=>p.id===view.selectedProfId);
  const dateLabel = cap(d.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}));

  if(!prof){
    document.getElementById('content').innerHTML = `
      <button class="back-link" id="back-to-cal">← Voltar ao calendário</button>
      <h3 class="day-title">${dateLabel}</h3>
      <div class="empty-state">${psiBadge(56)}<div>Profissional não encontrada.</div></div>`;
    attachAgendaHandlers();
    return;
  }

  const canEditPatient = currentUser.role!=='profissional' || currentUser.profissionalId===prof.id;
  const canEditTime = canEditHorarios();
  const dk = dateKey(d);
  const slots = await loadAppts(prof.id, dk);

  let slotsHtml = slots.map(s=>renderSlot(prof.id, s, canEditPatient, canEditTime)).join('');
  if(slots.length===0){
    slotsHtml = `<div style="padding:24px 16px;text-align:center;color:var(--muted);font-size:13px;">Nenhum horário criado para este dia ainda.</div>`;
  }

  const addRow = canEditTime ? `
    <div class="add-slot-row" id="add-slot-row">
      <button class="add-slot-link" id="show-add-slot">+ Adicionar horário</button>
    </div>` : '';

  const backLabel = view.multiProfDay ? 'Escolher outra profissional' : 'Voltar ao calendário';

  document.getElementById('content').innerHTML = `
    <button class="back-link" id="back-to-day-prev">← ${backLabel}</button>
    <h3 class="day-title">${dateLabel}</h3>
    <p class="day-sub">
      <span style="display:inline-flex;align-items:center;gap:6px;">
        <span class="avatar" style="width:22px;height:22px;font-size:10.5px;">${initials(prof.nome)}</span>
        <strong style="color:var(--primary-dark);">${prof.nome}</strong>
      </span>
      ${canEditTime ? ' — crie, edite ou remova os horários do dia.' : ' — preencha o paciente e as observações de cada horário.'}
    </p>
    <button class="print-btn" id="print-agenda-btn">🖨️ Imprimir agenda deste dia</button>
    <div class="prof-block">
      ${slotsHtml}
      ${addRow}
    </div>
    ${renderPrintArea(prof, dateLabel, slots)}
  `;
  attachAgendaHandlers();
  startDayPoll();
}

function renderPrintArea(prof, dateLabel, slots){
  const rows = slots.map(s=>`
    <tr>
      <td class="mono">${s.horarioInicio} – ${s.horarioFim}</td>
      <td>${(s.paciente||'').replace(/</g,'&lt;')}</td>
      <td>${(s.obs||'').replace(/</g,'&lt;')}</td>
    </tr>`).join('');
  const body = rows || `<tr><td colspan="3" style="text-align:center;color:#888;">Nenhum horário criado para este dia.</td></tr>`;
  return `
    <div id="print-area">
      <h2 style="font-family:'Fraunces',serif;margin-bottom:2px;">PsiAgenda</h2>
      <div style="font-size:15px;font-weight:600;">${prof.nome}</div>
      <div style="font-size:13px;color:#555;margin-bottom:6px;">${dateLabel}</div>
      <table>
        <thead><tr><th>Horário</th><th>Paciente</th><th>Observações</th></tr></thead>

      </table>

}

function renderSlot(profId, s, canEditPatient, canEditTime){
  const timeHtml = canEditTime
    ? `<input class="slot-time-input" value="${s.horarioInicio}" data-time-field="horarioInicio" data-appt-id="${s.id}">
       <span style="color:var(--muted);">–</span>
       <input class="slot-time-input" value="${s.horarioFim}" data-time-field="horarioFim" data-appt-id="${s.id}">`
    : `<span class="slot-time-static mono">${s.horarioInicio} – ${s.horarioFim}</span>`;
  const delBtn = canEditTime ? `<span class="slot-del-btn" data-del-appt="${s.id}" title="Excluir horário">×</span>` : '';
  const patVal = (s.paciente||'').replace(/"/g,'&quot;');
  const obsVal = (s.obs||'').replace(/"/g,'&quot;');
  return `

        <span style="flex:1;"></span>
        ${delBtn}

      <input class="obs-input" placeholder="Observações da sessão" value="${obsVal}" data-appt-id="${s.id}" data-field="obs" ${canEditPatient?'':'disabled'}>
      <div class="save-flag" data-flag="${s.id}">Salvo ✓</div>
    </div>`;
}

function renderDayView(){

}

function attachAgendaHandlers(){
  const prevBtn = document.getElementById('prev-month');
  const nextBtn = document.getElementById('next-month');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{ view.monthCursor = new Date(view.monthCursor.getFullYear(), view.monthCursor.getMonth()-1, 1); render(); });
  if(nextBtn) nextBtn.addEventListener('click', ()=>{ view.monthCursor = new Date(view.monthCursor.getFullYear(), view.monthCursor.getMonth()+1, 1); render(); });

  document.querySelectorAll('.cal-day[data-date]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [y,m,dd] = btn.dataset.date.split('-').map(Number);
      const selDate = new Date(y, m-1, dd);
      const profs = visibleProfessionals();
      view.selectedDate = selDate;
      if(profs.length===1){
        view.screen = 'day';
        view.selectedProfId = profs[0].id;
        view.multiProfDay = false;
        render();
        renderDayViewAsync();
      }else{
        view.screen = 'profSelect';
        view.selectedProfId = null;
        view.multiProfDay = profs.length>1;
        render();
      }
    });
  });

  document.querySelectorAll('[data-select-prof]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      view.selectedProfId = btn.dataset.selectProf;
      view.screen = 'day';
      render();
      renderDayViewAsync();
    });
  });

  const backBtn = document.getElementById('back-to-cal');
  if(backBtn) backBtn.addEventListener('click', ()=>{ view.screen='calendar'; view.selectedDate=null; view.selectedProfId=null; render(); });

  const backDayBtn = document.getElementById('back-to-day-prev');
  if(backDayBtn) backDayBtn.addEventListener('click', ()=>{
    if(view.multiProfDay){ view.screen='profSelect'; view.selectedProfId=null; }
    else{ view.screen='calendar'; view.selectedDate=null; }
    render();
  });

  // paciente / observações
  document.querySelectorAll('.pat-input, .obs-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const apptId = e.target.dataset.apptId;
      const field = e.target.dataset.field;
      const flag = document.querySelector(`.save-flag[data-flag="${apptId}"]`);
      try{
        await api('/appointments/'+view.selectedProfId+'/'+apptId, { method:'PUT', body: JSON.stringify({ [field]: e.target.value }) });
        if(flag){ flag.textContent='Salvo ✓'; flag.style.color='var(--success)'; flag.classList.add('show'); setTimeout(()=>flag.classList.remove('show'), 1400); }
      }catch(err){
        if(flag){ flag.textContent='Erro ao salvar: '+err.message; flag.style.color='var(--danger)'; flag.classList.add('show'); }
      }
    });
  });

  // horário início/fim (só recepção/admin)
  document.querySelectorAll('.slot-time-input').forEach(inp=>{
    inp.addEventListener('change', async (e)=>{
      const apptId = e.target.dataset.apptId;
      const field = e.target.dataset.timeField;
      try{
        await api('/appointments/'+view.selectedProfId+'/'+apptId, { method:'PUT', body: JSON.stringify({ [field]: e.target.value }) });
        renderDayViewAsync();
      }catch(err){ alert(err.message); }
    });
  });

  // excluir horário
  document.querySelectorAll('[data-del-appt]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Excluir este horário?')) return;
      try{
        await api('/appointments/'+view.selectedProfId+'/'+btn.dataset.delAppt, { method:'DELETE' });
        renderDayViewAsync();
      }catch(err){ alert(err.message); }
    });
  });

  // + adicionar horário
  const showAddBtn = document.getElementById('show-add-slot');
  if(showAddBtn) showAddBtn.addEventListener('click', ()=>openAddSlotForm());

  // imprimir agenda do dia
  const printBtn = document.getElementById('print-agenda-btn');
  if(printBtn) printBtn.addEventListener('click', ()=>window.print());

  // imprimir as agendas de TODAS as profissionais (dia mostrado no painel)
  const printAllBtn = document.getElementById('open-print-all-btn');
  if(printAllBtn) printAllBtn.addEventListener('click', async ()=>{
    printAllBtn.disabled = true; printAllBtn.textContent = 'Gerando…';
    try{ await printAllSchedules(); }
    catch(err){ alert(err.message); }
    printAllBtn.disabled = false; printAllBtn.textContent = '🖨️ Imprimir agendas do dia';
  });

  // se estamos no calendário, carrega o painel de vagas do dia
  if(document.getElementById('hoje-painel')) renderHojePainelAsync();
}

// Junta as agendas de todas as profissionais do dia mostrado no painel
// numa impressão só — cada profissional começando numa folha nova.
async function printAllSchedules(){
  const hojeReal = new Date();
  const dia = painelDate ? new Date(painelDate) : new Date(hojeReal.getFullYear(), hojeReal.getMonth(), hojeReal.getDate());
  const dk = dateKey(dia);
  const dateLabel = cap(dia.toLocaleDateString('pt-BR',{weekday:'long', day:'2-digit', month:'long', year:'numeric'}));
  const profs = visibleProfessionals();
  if(profs.length===0) throw new Error('Nenhuma profissional cadastrada.');

  const secoes = [];
  for(const prof of profs){
    let slots = [];
    try{ slots = await loadAppts(prof.id, dk); }catch(e){ slots = []; }
    const rows = slots.map(s=>`
      <tr>
        <td class="mono">${s.horarioInicio} – ${s.horarioFim}</td>
        <td>${(s.paciente||'').replace(/</g,'&lt;') || '<span style="color:#999;">livre</span>'}</td>
        <td>${(s.obs||'').replace(/</g,'&lt;')}</td>
      </tr>`).join('');
    const body = rows || `<tr><td colspan="3" style="text-align:center;color:#888;">Nenhum horário criado para este dia.</td></tr>`;
    secoes.push(`
      <div class="p-section">
        <h2 style="font-family:'Fraunces',serif;margin-bottom:2px;">PsiAgenda</h2>
        <div style="font-size:15px;font-weight:600;">${prof.nome}</div>
        <div style="font-size:13px;color:#555;margin-bottom:6px;">${dateLabel}</div>
        <table>
          <thead><tr><th>Horário</th><th>Paciente</th><th>Observações</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      </div>`);
  }

  let area = document.getElementById('print-area');
  if(!area){
    area = document.createElement('div');
    area.id = 'print-area';
    document.body.appendChild(area);
  }
  area.innerHTML = secoes.join('');
  setTimeout(()=>window.print(), 100);
}

// Retorna as N datas (objetos Date) da mesma repetição semanal a partir de baseDate,
// incluindo a própria baseDate. weeks=4 => baseDate + 3 semanas seguintes.
function weeklyRepeatDates(baseDate, weeks){
  const out = [];
  for(let i=0;i<weeks;i++){
    out.push(new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate() + i*7));
  }
  return out;
}
function ddmm(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }

function openAddSlotForm(){
  const row = document.getElementById('add-slot-row');
  if(!row) return;
  row.innerHTML = `
    <div style="text-align:left;">
      <div id="shared-time-row" style="display:flex;gap:8px;margin-bottom:8px;">
        <input class="slot-time-input" id="new-slot-inicio" placeholder="08:00" style="width:80px;">
        <span style="color:var(--muted);align-self:center;">–</span>
        <input class="slot-time-input" id="new-slot-fim" placeholder="08:50" style="width:80px;">
      </div>
      <input class="pat-input" id="new-slot-paciente" placeholder="Paciente (opcional)" style="margin-bottom:8px;">
      <label style="display:flex;align-items:flex-start;gap:9px;background:rgba(185,169,217,0.18);border:1px solid rgba(185,169,217,0.4);border-radius:10px;padding:11px 12px;margin-bottom:10px;cursor:pointer;">
        <input type="checkbox" id="new-slot-repeat" style="margin-top:2px;accent-color:var(--primary);width:15px;height:15px;flex-shrink:0;">
        <span style="font-size:12.5px;color:#5b4d82;line-height:1.5;">
          <strong style="color:var(--primary-dark);">Repetir semanalmente por 4 semanas</strong><br>
          Cria a sessão nas próximas 3 semanas também, no mesmo dia da semana, com o mesmo paciente. Cada data fica independente — dá pra editar depois.
        </span>
      </label>

      <div id="repeat-options" style="display:none;margin-bottom:12px;">
        <div style="font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">As 4 sessões vão ter o mesmo horário?</div>
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <button type="button" class="btn-secondary" id="repeat-same-btn" style="flex:1;">Sim, mesmo horário</button>
          <button type="button" class="btn-secondary" id="repeat-diff-btn" style="flex:1;">Não, horários diferentes</button>
        </div>
        <div id="repeat-dates-preview" style="display:none;flex-wrap:wrap;gap:6px;margin-bottom:6px;"></div>
        <div id="repeat-custom-rows" style="display:none;"></div>
      </div>

      <div style="display:flex;gap:8px;">
        <button class="btn-secondary" id="cancel-add-slot" style="flex:1;">Cancelar</button>
        <button class="btn-primary" id="save-add-slot" style="flex:1;">Salvar horário</button>
      </div>
    </div>`;
  document.getElementById('cancel-add-slot').addEventListener('click', ()=>renderDayViewAsync());

  const repeatChk = document.getElementById('new-slot-repeat');
  const repeatOptions = document.getElementById('repeat-options');
  const sameBtn = document.getElementById('repeat-same-btn');
  const diffBtn = document.getElementById('repeat-diff-btn');
  const preview = document.getElementById('repeat-dates-preview');
  const customRows = document.getElementById('repeat-custom-rows');
  const sharedTimeRow = document.getElementById('shared-time-row');
  let repeatMode = null; // 'same' | 'diff'

  function setActiveModeBtn(mode){
    [[sameBtn,'same'],[diffBtn,'diff']].forEach(([btn,val])=>{
      const active = mode===val;
      btn.style.background = active ? 'var(--primary)' : 'var(--surface)';
      btn.style.color = active ? '#fff' : 'var(--text)';
      btn.style.borderColor = active ? 'var(--primary)' : 'var(--line)';
    });
  }

  function renderCustomRows(){
    const dates = weeklyRepeatDates(view.selectedDate, 4);
    customRows.innerHTML = dates.map((d,i)=>`
      <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
        <input type="date" class="slot-time-input" style="width:132px;" id="repeat-date-${i}" value="${dateKey(d)}">
        <input class="slot-time-input" style="width:60px;" id="repeat-inicio-${i}" placeholder="08:00">
        <span style="color:var(--muted);">–</span>
        <input class="slot-time-input" style="width:60px;" id="repeat-fim-${i}" placeholder="08:50">
      </div>`).join('');
  }

  repeatChk.addEventListener('change', ()=>{
    if(repeatChk.checked){
      repeatOptions.style.display = 'block';
    }else{
      repeatOptions.style.display = 'none';
      repeatMode = null;
      preview.style.display = 'none'; preview.innerHTML = '';
      customRows.style.display = 'none'; customRows.innerHTML = '';
      sharedTimeRow.style.display = 'flex';
      setActiveModeBtn(null);
    }
  });

  sameBtn.addEventListener('click', ()=>{
    repeatMode = 'same';
    setActiveModeBtn('same');
    sharedTimeRow.style.display = 'flex';
    customRows.style.display = 'none'; customRows.innerHTML = '';
    const dates = weeklyRepeatDates(view.selectedDate, 4);
    preview.innerHTML = dates.map(d=>`<span style="font-size:11px;font-weight:600;padding:4px 9px;border-radius:20px;background:rgba(74,71,133,0.12);color:var(--primary);">${ddmm(d)}</span>`).join('');
    preview.style.display = 'flex';
  });

  diffBtn.addEventListener('click', ()=>{
    repeatMode = 'diff';
    setActiveModeBtn('diff');
    sharedTimeRow.style.display = 'none';
    preview.style.display = 'none'; preview.innerHTML = '';
    customRows.style.display = 'block';
    renderCustomRows();
  });

  document.getElementById('save-add-slot').addEventListener('click', async ()=>{
    const paciente = document.getElementById('new-slot-paciente').value.trim();

    if(repeatChk.checked && !repeatMode){ alert('Escolha se o horário será o mesmo ou diferente nas 4 semanas.'); return; }

    if(repeatChk.checked && repeatMode==='diff'){
      const rows = [];
      for(let i=0;i<4;i++){
        const date = document.getElementById('repeat-date-'+i).value;
        const inicio = document.getElementById('repeat-inicio-'+i).value.trim();
        const fim = document.getElementById('repeat-fim-'+i).value.trim();
        if(!date || !inicio || !fim){ alert('Preencha data, início e fim das 4 sessões.'); return; }
        rows.push({ date, inicio, fim });
      }
      try{
        for(const r of rows){
          await api('/appointments/'+view.selectedProfId, {
            method:'POST',
            body: JSON.stringify({ date: r.date, horarioInicio: r.inicio, horarioFim: r.fim, paciente })
          });
        }
        renderDayViewAsync();
      }catch(err){ alert(err.message); }
      return;
    }

    const inicio = document.getElementById('new-slot-inicio').value.trim();
    const fim = document.getElementById('new-slot-fim').value.trim();
    if(!inicio || !fim){ alert('Informe início e fim do horário.'); return; }
    const repeatWeeks = (repeatChk.checked && repeatMode==='same') ? 4 : 1;
    try{
      await api('/appointments/'+view.selectedProfId, {
        method:'POST',
        body: JSON.stringify({ date: dateKey(view.selectedDate), horarioInicio: inicio, horarioFim: fim, paciente, repeatWeeks })
      });
      renderDayViewAsync();
    }catch(err){ alert(err.message); }
  });
}

/* ============== PROFISSIONAIS TAB ============== */
function renderProfissionaisTab(){
  const isAdmin = currentUser.role==='admin';
  let cards = professionals.map(p=>`
    <div class="list-card">
      <div class="li-main">
        <div class="avatar">${initials(p.nome)}</div>
        <div class="li-info">
          <div class="li-title">${p.nome}</div>
          ${isAdmin ? `<div class="li-sub">${p.googleConnected ? '🟢 Google Agenda conectada' : '⚪ Google Agenda não conectada'}</div>` : ''}
        </div>
      </div>
      ${isAdmin ? `<button class="btn-secondary" data-edit-prof="${p.id}" style="padding:8px 12px;font-size:12.5px;">Editar</button>` : ''}
    </div>`).join('');

  if(professionals.length===0) cards = `<div class="empty-state">${psiBadge(56)}<div>Nenhuma profissional cadastrada.</div></div>`;

  return `
    <div class="section-title"><h3>Profissionais</h3>${isAdmin?'<button class="add-btn" id="add-prof-btn">+ Nova</button>':''}</div>
    <div class="list-grid">${cards}</div>
  `;
}
function attachProfissionaisHandlers(){
  const addBtn = document.getElementById('add-prof-btn');
  if(addBtn) addBtn.addEventListener('click', ()=>openProfModal(null));
  document.querySelectorAll('[data-edit-prof]').forEach(btn=>{
    btn.addEventListener('click', ()=>openProfModal(btn.dataset.editProf));
  });
}
function openProfModal(profId){
  const editing = profId ? professionals.find(p=>p.id===profId) : null;
  const googleSection = editing ? `
        <div class="field">
          <label>Google Agenda</label>
          <div id="pf-google-status" style="font-size:13px;color:#555;margin-bottom:8px;">
            ${editing.googleConnected ? '🟢 Conectada — os agendamentos feitos aqui aparecem automaticamente na agenda dela.' : '⚪ Ainda não conectada.'}
          </div>
          ${editing.googleConnected
            ? `<button type="button" class="btn-secondary" id="pf-google-disconnect" style="padding:8px 12px;font-size:12.5px;">Desconectar</button>`
            : `<button type="button" class="btn-secondary" id="pf-google-connect" style="padding:8px 12px;font-size:12.5px;">Conectar Google Agenda</button>`}
        </div>` : `<div class="note-box" style="font-size:12.5px;">Salve a profissional com um e-mail preenchido para poder conectar o Google Agenda dela depois.</div>`;
  const modalHtml = `
    <div class="modal-bg" id="modal-bg">
      <div class="modal">
        <h3>${editing?'Editar profissional':'Nova profissional'}</h3>
        <div class="field"><label>Nome</label><input id="pf-nome" value="${editing?editing.nome:''}" placeholder="ex: Dra. Marina Costa"></div>
        <div class="field"><label>E-mail do Google (pessoal)</label><input id="pf-email" type="email" value="${editing&&editing.email?editing.email:''}" placeholder="ex: marina@gmail.com"></div>
        ${googleSection}
        <div class="modal-actions">
          ${editing?`<button class="btn-danger" id="pf-delete" style="padding:12px 16px;">Excluir</button>`:''}
          <button class="btn-primary" id="pf-save">Salvar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg') closeModal(); });
  document.getElementById('pf-save').addEventListener('click', async ()=>{
    const nome = document.getElementById('pf-nome').value.trim();
    const email = document.getElementById('pf-email').value.trim();
    if(!nome) return;
    const saveBtn = document.getElementById('pf-save'); saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
    try{
      if(editing){
        const updated = await api('/professionals/'+editing.id, {method:'PUT', body: JSON.stringify({nome, email})});
        Object.assign(editing, updated);
      }else{
        const created = await api('/professionals', {method:'POST', body: JSON.stringify({nome, email})});
        professionals.push(created);
      }
      closeModal(); render();
    }catch(err){
      alert(err.message);
      saveBtn.disabled = false; saveBtn.textContent = 'Salvar';
    }
  });
  const delBtn = document.getElementById('pf-delete');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(!confirm('Excluir esta profissional? A agenda dela deixará de aparecer.')) return;
    try{
      await api('/professionals/'+editing.id, {method:'DELETE'});
      professionals = professionals.filter(p=>p.id!==editing.id);
      closeModal(); render();
    }catch(err){ alert(err.message); }
  });
  const connectBtn = document.getElementById('pf-google-connect');
  if(connectBtn) connectBtn.addEventListener('click', async ()=>{
    connectBtn.disabled = true; connectBtn.textContent = 'Gerando link…';
    try{
      const { url } = await api('/google/connect/'+editing.id, {method:'GET'});
      window.open(url, '_blank');
      alert('Uma nova aba abriu para a profissional entrar com a conta Google dela e autorizar. Depois de autorizar, feche a aba e reabra esta tela de edição para ver o status atualizado.');
    }catch(err){
      alert(err.message);
    }
    connectBtn.disabled = false; connectBtn.textContent = 'Conectar Google Agenda';
  });
  const disconnectBtn = document.getElementById('pf-google-disconnect');
  if(disconnectBtn) disconnectBtn.addEventListener('click', async ()=>{
    if(!confirm('Desconectar o Google Agenda desta profissional? Os agendamentos deixarão de ser copiados pra lá.')) return;
    try{
      await api('/google/disconnect/'+editing.id, {method:'POST'});
      editing.googleConnected = false;
      closeModal(); openProfModal(editing.id);
    }catch(err){ alert(err.message); }
  });
}
function closeModal(){ const m = document.getElementById('modal-bg'); if(m) m.remove(); }

/* ============== USUARIOS TAB (admin only) ============== */
function renderUsuariosTab(){
  const cards = users.map(u=>{
    const profName = u.profissionalId ? (professionals.find(p=>p.id===u.profissionalId)||{}).nome : null;
    return `
    <div class="list-card">
      <div class="li-main">
        <div class="avatar">${initials(u.nome)}</div>
        <div class="li-info">
          <div class="li-title">${u.nome} <span class="badge ${u.role}">${{admin:'Admin',profissional:'Profissional',recepcao:'Recepção'}[u.role]}</span></div>
          <div class="li-sub">usuário: ${u.username}${profName?' · '+profName:''}</div>
        </div>
      </div>
      ${u.username!=='admin' || currentUser.username!==u.username ? `<button class="btn-secondary" data-edit-user="${u.username}" style="padding:8px 12px;font-size:12.5px;">Editar</button>` : ''}
    </div>`;
  }).join('');

  return `
    <div class="note-box">📊 O banco de dados deste app é o Supabase — profissionais, usuários e horários ficam gravados lá.</div>
    <div class="section-title"><h3>Usuários</h3><button class="add-btn" id="add-user-btn">+ Novo</button></div>
    <div class="list-grid">${cards}</div>
  `;
}
function attachUsuariosHandlers(){
  document.getElementById('add-user-btn').addEventListener('click', ()=>openUserModal(null));
  document.querySelectorAll('[data-edit-user]').forEach(btn=>{
    btn.addEventListener('click', ()=>openUserModal(btn.dataset.editUser));
  });
}
function openUserModal(username){
  const editing = username ? users.find(u=>u.username===username) : null;
  const modalHtml = `
    <div class="modal-bg" id="modal-bg">
      <div class="modal">
        <h3>${editing?'Editar usuário':'Novo usuário'}</h3>
        <div class="field"><label>Nome completo</label><input id="us-nome" value="${editing?editing.nome:''}" placeholder="ex: Rafael Torres"></div>
        <div class="field"><label>Usuário (login)</label><input id="us-user" value="${editing?editing.username:''}" placeholder="ex: dr.rafael" ${editing?'disabled':''}></div>
        <div class="field"><label>Senha</label><input id="us-pass" type="text" value="" placeholder="${editing?'deixe em branco para manter a atual':'defina uma senha'}"></div>
        <div class="field">
          <label>Perfil de acesso</label>
          <select id="us-role">
            <option value="profissional" ${editing&&editing.role==='profissional'?'selected':''}>Profissional</option>
            <option value="recepcao" ${editing&&editing.role==='recepcao'?'selected':''}>Recepção</option>
            <option value="admin" ${editing&&editing.role==='admin'?'selected':''}>Administrador</option>
          </select>
        </div>
        <div class="field" id="us-prof-field" style="display:${(editing?editing.role:'profissional')==='profissional'?'block':'none'};">
          <label>Vincular à profissional</label>
          <select id="us-prof">
            <option value="">—</option>
            ${professionals.map(p=>`<option value="${p.id}" ${editing&&editing.profissionalId===p.id?'selected':''}>${p.nome}</option>`).join('')}
          </select>
        </div>
        <div class="modal-actions">
          ${editing && editing.username!=='admin' ? `<button class="btn-danger" id="us-delete" style="padding:12px 16px;">Excluir</button>`:''}
          <button class="btn-primary" id="us-save">Salvar</button>
        </div>
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', modalHtml);
  document.getElementById('modal-bg').addEventListener('click', (e)=>{ if(e.target.id==='modal-bg') closeModal(); });
  const roleSel = document.getElementById('us-role');
  roleSel.addEventListener('change', ()=>{
    document.getElementById('us-prof-field').style.display = roleSel.value==='profissional' ? 'block' : 'none';
  });
  document.getElementById('us-save').addEventListener('click', async ()=>{
    const nome = document.getElementById('us-nome').value.trim();
    const usernameVal = document.getElementById('us-user').value.trim().toLowerCase();
    const senha = document.getElementById('us-pass').value;
    const role = document.getElementById('us-role').value;
    const profissionalId = role==='profissional' ? (document.getElementById('us-prof').value || null) : null;
    if(!nome || !usernameVal || (!editing && !senha)){ alert('Preencha nome, usuário e senha.'); return; }
    const saveBtn = document.getElementById('us-save'); saveBtn.disabled = true; saveBtn.textContent = 'Salvando…';
    try{
      if(editing){
        const body = {nome, role, profissionalId};
        if(senha) body.senha = senha;
        const updated = await api('/users/'+editing.username, {method:'PUT', body: JSON.stringify(body)});
        Object.assign(editing, updated);
      }else{
        const created = await api('/users', {method:'POST', body: JSON.stringify({username:usernameVal, nome, senha, role, profissionalId})});
        users.push(created);
      }
      closeModal(); render();
    }catch(err){
      alert(err.message);
      saveBtn.disabled = false; saveBtn.textContent = 'Salvar';
    }
  });
  const delBtn = document.getElementById('us-delete');
  if(delBtn) delBtn.addEventListener('click', async ()=>{
    if(!confirm('Excluir este usuário?')) return;
    try{
      await api('/users/'+editing.username, {method:'DELETE'});
      users = users.filter(u=>u.username!==editing.username);
      closeModal(); render();
    }catch(err){ alert(err.message); }
  });
}

/* ============== INIT ============== */
(async function init(){
  render();
  try{
    const savedToken = localStorage.getItem('psiagenda_token');
    const savedUser = localStorage.getItem('psiagenda_user');
    if(savedToken && savedUser){
      authToken = savedToken;
      currentUser = JSON.parse(savedUser);
      await loadClinicData();
    }
  }catch(err){
    console.error('Não foi possível restaurar a sessão salva:', err);
    logoutLocal();
  }
  loading = false;
  render();
})();
</script>
